name: Generate contribution snake

on:
  schedule:
    # Runs every day at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: Crepco
          outputs: |
            output/github-contribution-grid-snake.svg?color_snake=#9854f1&color_dots=#dfe1ec,#b8c4e6,#8aa5e0,#5a82d6,#2e7de9
            output/github-contribution-grid-snake-dark.svg?color_snake=#bb9af7&color_dots=#20222e,#2a4a7f,#3a5fb0,#4f86e8,#7aa2f7

      - name: Push snake
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "chore: update contribution snake"
          git push
